[package]
name = "onemodel"
version = "0.1.0"
description = "Dedupe byte-identical AI model files across local-AI app stores with copy-on-write clones, reversibly"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
xattr = "1"

[dev-dependencies]
tempfile = "3"
